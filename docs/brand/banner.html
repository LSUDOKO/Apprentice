<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 560px; background: #0B0D08; color: #ECEEDF; font-family: Geist, sans-serif; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(236 238 223 / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(236 238 223 / .05) 1px, transparent 1px); background-size: 80px 80px; }
  .orb { position: absolute; width: 760px; height: 760px; right: -120px; top: 40px; border-radius: 50%;
    background: radial-gradient(circle at 50% 18%, #f4ffb8 0%, #DDF26B 18%, #8fa035 46%, #2a3112 72%, #11140a 100%);
    box-shadow: inset 0 2px 0 rgb(255 255 255 / .5), 0 0 120px -10px rgb(221 242 107 / .45); }
  .grain { position: absolute; inset: 0; opacity: .12; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }
  .copy { position: absolute; left: 96px; top: 84px; width: 900px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 500; }
  .brand svg { width: 48px; height: 48px; }
  h1 { margin-top: 48px; font-size: 104px; font-weight: 600; letter-spacing: -0.045em; line-height: .95; }
  p { margin-top: 28px; font-size: 30px; color: #b8bea6; letter-spacing: -0.01em; max-width: 760px; line-height: 1.3; }
  .strip { position: absolute; left: 96px; right: 96px; bottom: 40px; display: flex; gap: 56px; font-family: 'Geist Mono', monospace; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: #8E957D; }
  .strip b { color: #DDF26B; font-weight: 500; }
  .cross { position: absolute; color: #8E957D; font-family: 'Geist Mono'; font-size: 22px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb"></div>
  <div class="grain"></div>
  <span class="cross" style="left:72px;top:72px">+</span>
  <span class="cross" style="left:1032px;top:72px">+</span>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#13160E" stroke="#2A2F1D"/><path d="M14 46 L28 16 h8 L50 46 h-9 l-3-7 H26 l-3 7Z M29 31 h6 l-3-8Z" fill="#DDF26B"/></svg>
      Apprentice
    </div>
    <h1>Show it once.<br />Delegate forever.</h1>
    <p>The agent that learns your triage by watching you work, proves it with backtests, then earns autonomy.</p>
  </div>
  </body>
</html>
